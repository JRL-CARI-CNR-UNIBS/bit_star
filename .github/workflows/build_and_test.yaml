name: build-and-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        ubuntu_version: [ubuntu:22.04, ubuntu:24.04]
      fail-fast: false
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.ubuntu_version }}

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update
          apt install -y cmake build-essential git libboost-all-dev libeigen3-dev libyaml-cpp-dev libpoco-dev libgtest-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: bit_star

      - name: Build & install cnr_class_loader and graph_core (same branches as deps.repos)
        run: |
          export PATH_TO_WS="$(pwd)"
          echo "PATH_TO_WS=$PATH_TO_WS" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PATH_TO_WS/install/lib" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$PATH_TO_WS/install" >> "$GITHUB_ENV"

          # Installed before graph_core, so that graph_core finds it instead of downloading it
          git clone -b modern_cmake https://github.com/JRL-CARI-CNR-UNIBS/cnr_class_loader.git
          cmake -S cnr_class_loader -B build/cnr_class_loader -DCMAKE_INSTALL_PREFIX=$PATH_TO_WS/install
          cmake --build build/cnr_class_loader -j4 --target install

          git clone -b removing_cnr_logger_and_params https://github.com/JRL-CARI-CNR-UNIBS/graph_core.git
          cmake -S graph_core/graph_core -B build/graph_core -DCMAKE_INSTALL_PREFIX=$PATH_TO_WS/install \
            -DCMAKE_PREFIX_PATH=$PATH_TO_WS/install -DBUILD_TESTS=OFF
          cmake --build build/graph_core -j4 --target install

      - name: Build & install bit_star
        run: |
          cmake -S bit_star -B build/bit_star -DCMAKE_INSTALL_PREFIX=$PATH_TO_WS/install -DCMAKE_PREFIX_PATH=$PATH_TO_WS/install
          cmake --build build/bit_star -j4 --target install

      - name: Run tests
        run: |
          cd build/bit_star
          ctest --output-on-failure
